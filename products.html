
<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>المنتجات | أثر</title>

    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="style.css">

    <script src="./products.js" defer></script>

    <script src="./main.js" defer></script>


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>

<body>

    <header>

        <div class="right-bar">

            <a class="logo">

                <i
                    class="fa-brands fa-pagelines"
                    style="color: rgb(6, 60, 49);">
                </i>

                أثر

            </a>

        </div>

        <ul class="navbar">

            <li>
                <a href="./home.html">
                    الرئيسية
                </a>
            </li>

            <li>
                <a
                    href="./products.html"
                    class="products-active">
                    المنتجات
                </a>
            </li>

            <li>
                <a href="./about.html">
                    من نحن
                </a>
            </li>

            <li>
                <a href="./contact.html">
                    تواصل معنا
                </a>
            </li>

        </ul>

        <div class="search">

            <input
                type="text"
                id="search-box"
                placeholder="ابحث عن المنتج..."
            >

            <button id="search-button">

                <i
                    class="fa-solid fa-magnifying-glass"
                    style="color: rgb(6, 60, 49);">
                </i>

            </button>

        </div>

        <div class="profile">

            <i
                class="fa-solid fa-user"
                style="color: rgb(6, 60, 49);">
            </i>

            <i
                class="fa-solid fa-cart-shopping"
                style="color: rgb(6, 60, 49);">
            </i>

        </div>

    </header>

    <section class="top-prod">

        <h3>تسوّق حسب الفئة</h3>

        <div class="categories">

            <div
                class="cloths category-btn"
                data-category="ملابس">

                <i class="fa-solid fa-vest"></i>

                <p>ملابس</p>

            </div>

            <div
                class="bags category-btn"
                data-category="إكسسوارات">

                <i class="fa-solid fa-bag-shopping"></i>

                <p>إكسسوارات</p>

            </div>

            <div
                class="gifts category-btn"
                data-category="هدايا">

                <i class="fa-solid fa-gift"></i>

                <p>هدايا</p>

            </div>

        </div>

        <div id="productsContainer"></div>

    </section>

    <div class="cart"> <h1>سلة المشتريات</h1>
        <ul class="cart-list"></ul>
        <p class="total-title"> Total Price:&nbsp;</p><p class="total"></p>
    </div>

</body>

</html>
